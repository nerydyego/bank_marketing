[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "bank-marketing"
version = "0.1.0"
description = "Projeto de aprendizado supervisionado utilizando o Bank Marketing Dataset."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    {name = "Dyego Nery", email = "dyego-nery@gmail.com"}
]

dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
]


[project.optional-dependencies]
notebook = [
    "jupyterlab",
    "ipykernel"
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]